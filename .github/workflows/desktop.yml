name: Desktop-App bauen

on:
  push:
    branches: [stage-5-desktop, 'stage-6-*', 'stage-7-*', 'stage-8-*']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npx electron-builder --mac
            files: dist/*.dmg
          - name: Windows
            os: windows-latest
            command: npx electron-builder --win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: blueforte-notes-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

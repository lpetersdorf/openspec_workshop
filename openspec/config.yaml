schema: spec-driven

# Projektkontext: geht in jeden Prompt für jedes Artefakt
context: |
  Blueforte Notes: Diktier-App als Single-Page-App ohne Build-Schritt
  Dateien: index.html, style.css, app.js
  Spracherkennung: Web Speech API des Browsers, Sprache de-DE
  Kein Backend, kein API-Key, keine externen Bibliotheken
  Unterstützte Browser: Chrome, Edge, Safari. Firefox zeigt einen Hinweis.
  Start lokal über "npx serve ." (Mikrofon braucht localhost oder https)
  Notizen im Obsidian-Format: Markdown mit YAML-Frontmatter
  Artefakte auf Deutsch schreiben, Requirements mit SHALL oder MUST

# Regeln je Artefakt
rules:
  proposal:
    - Immer einen Abschnitt "Nicht im Umfang" aufnehmen
  specs:
    - Jede Requirement hat mindestens ein Scenario mit WHEN/THEN
    - Verhalten beschreiben, keine Implementierungsdetails
  tasks:
    - Kleine, einzeln prüfbare Aufgaben

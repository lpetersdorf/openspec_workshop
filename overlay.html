<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Blueforte Notes · Aufnahme</title>
  <style>
    :root {
      --bg: #1e2223; --fg: #ffffff; --fg2: #cfd1d4; --line: #3d3d3d;
      --rec: #ff6b5f; --accent: #32aac7;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--fg); }
    .pill {
      position: absolute; inset: 6px; display: flex; align-items: center; gap: 12px;
      padding: 0 10px 0 16px; border-radius: 32px; background: var(--bg);
      border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(0,0,0,.28);
      -webkit-app-region: drag; user-select: none;
    }
    .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--fg2); }
    .rec .dot { background: var(--rec); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .rec .dot { animation: none; } }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg2); }
    #time { font-variant-numeric: tabular-nums; font-weight: 600; }
    .meters { display: flex; flex-direction: column; gap: 3px; }
    .meter-row { display: flex; align-items: center; gap: 6px; }
    .who { flex: none; width: 62px; font-size: 10px; letter-spacing: .04em; color: var(--fg2); }
    .meter { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .meeting .main { gap: 3px; }
    [hidden] { display: none !important; }
    .meter > div { height: 100%; width: 0; background: var(--accent); transition: width 80ms linear; }
    .buttons { display: flex; gap: 6px; -webkit-app-region: no-drag; }
    button {
      font: inherit; font-weight: 600; color: var(--fg); background: transparent; cursor: pointer;
      border: 1px solid var(--fg2); border-radius: 999px; padding: 5px 11px;
    }
    button:hover { background: var(--fg); color: var(--bg); }
    button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    button.primary:hover { background: var(--fg2); }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <span class="dot" aria-hidden="true"></span>
    <div class="main">
      <div class="row"><span id="status">Bereit</span><span id="time">0:00</span></div>
      <div class="meters" aria-hidden="true">
        <div class="meter-row"><span class="who" id="whoMe" hidden>Ich</span><div class="meter"><div id="level"></div></div></div>
        <div class="meter-row" id="themRow" hidden><span class="who">Gegenüber</span><div class="meter"><div id="level2"></div></div></div>
      </div>
    </div>
    <div class="buttons">
      <button type="button" class="primary" id="stop">Stopp</button>
      <button type="button" class="primary" id="save" hidden>Speichern</button>
      <button type="button" id="open" title="Blueforte Notes öffnen">Öffnen</button>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
